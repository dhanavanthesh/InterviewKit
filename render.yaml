services:
  - type: web
    name: interview-kit-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: GROQ_API_KEY
        sync: false
